<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#006A6A" />
      <stop offset="100%" stop-color="#003737" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ECCC9" />
      <stop offset="100%" stop-color="#80F4F0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4ECCC9" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Rounded M3 squircle background -->
  <rect x="3" y="3" width="42" height="42" rx="14" fill="url(#bgGrad)" stroke="#4ECCC9" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Clock / Track ring -->
  <circle cx="24" cy="24" r="13" stroke="rgba(255,255,255,0.12)" stroke-width="3.5" fill="none"/>
  <!-- Active Arc -->
  <circle cx="24" cy="24" r="13" stroke="url(#ringGrad)" stroke-width="3.5" stroke-dasharray="81.68" stroke-dashoffset="24" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <!-- Clock hands / lightning icon -->
  <path d="M24 16V24L29 27" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Accent indicator dot -->
  <circle cx="24" cy="24" r="2.2" fill="#80F4F0" />
</svg>